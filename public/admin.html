<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Jai Shree Ram CNG</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="bg-white shadow rounded-lg p-6 mb-6 flex flex-col md:flex-row justify-between items-center">
            <h1 class="text-2xl font-bold text-orange-600 mb-4 md:mb-0">🙏 Jai Shree Ram CNG - Admin Dashboard</h1>
            <div class="flex items-center gap-4">
                <input type="date" id="filterDate" class="border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
                <button onclick="fetchTokens()" class="bg-orange-600 text-white px-4 py-2 rounded text-sm font-semibold hover:bg-orange-700 transition">Filter</button>
            </div>
        </header>

        <div class="bg-white shadow rounded-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-orange-100 text-orange-900 text-sm font-semibold border-b">
                            <th class="p-3">Token #</th>
                            <th class="p-3">Customer Name</th>
                            <th class="p-3">Vehicle Number</th>
                            <th class="p-3">Mobile</th>
                            <th class="p-3">Booking Date</th>
                            <th class="p-3">Payment</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tokenTableBody" class="divide-y divide-y-200 text-sm text-gray-700">
                        <!-- Data will be loaded dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchTokens() {
            const date = document.getElementById('filterDate').value;
            let url = '/api/tokens';
            if (date) url += `?date=${date}`;

            try {
                const response = await fetch(url);
                const result = await response.json();
                
                const tbody = document.getElementById('tokenTableBody');
                tbody.innerHTML = '';

                if (result.success && result.data.length > 0) {
                    result.data.forEach(token => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="p-3 font-bold text-orange-600">#${token.tokenNumber}</td>
                            <td class="p-3">${token.customerName}</td>
                            <td class="p-3 font-mono font-semibold">${token.vehicleNumber}</td>
                            <td class="p-3">${token.mobileNumber}</td>
                            <td class="p-3">${token.bookingDate}</td>
                            <td class="p-3"><span class="px-2 py-1 rounded text-xs font-semibold ${token.paymentType === 'Pay Now' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">${token.paymentType}</span></td>
                            <td class="p-3"><span class="px-2 py-1 rounded text-xs font-semibold bg-blue-100 text-blue-700">${token.paymentStatus}</span></td>
                        `;
                        tbody.appendChild(row);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-500">No tokens found.</td></tr>`;
                }
            } catch (error) {
                console.error('Error loading tokens:', error);
            }
        }

        // Load tokens on page load
        fetchTokens();
    </script>
</body>
</html>
